<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zorro del Desierto</title>

  <style>
    body {
      margin: 0;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #contenedor {
      text-align: center;
    }

    h1 {
      color: #555;
      margin-bottom: 10px;
    }

    canvas {
      background: #f7f7f7;
      border: 3px solid #555;
      border-radius: 6px;
    }

    p {
      color: #555;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div id="contenedor">
    <h1>Zorro del Desierto</h1>
    <canvas id="juego" width="900" height="300"></canvas>
    <p><b>Espacio / ↑</b>: saltar o reiniciar | <b>↓ / S</b>: agacharse</p>
  </div>

  <script>
    const canvas = document.getElementById("juego");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;
    const suelo = 230;

    const gris = "#555555";
    const fondo = "#f7f7f7";
    const grisClaro = "#d6d6d6";

    const metaPuntaje = 99000;

    let zorro;
    let conejo;
    let obstaculos;
    let nubes;
    let puntaje;
    let velocidad;
    let gravedad;
    let frame;
    let juegoTerminado;
    let ganaste;
    let proximoObstaculo;

    function reiniciar() {
      zorro = {
        x: 80,
        baseY: suelo,
        velY: 0,
        saltando: false,
        agachado: false
      };

      conejo = {
        x: 760,
        baseY: suelo
      };

      obstaculos = [];

      nubes = [
        { x: 250, y: 65, escala: 1 },
        { x: 570, y: 45, escala: 0.8 },
        { x: 780, y: 80, escala: 1.1 }
      ];

      puntaje = 0;
      velocidad = 6;
      gravedad = 0.7;
      frame = 0;
      juegoTerminado = false;
      ganaste = false;
      proximoObstaculo = 80;
    }

    function rectRedondo(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function dibujarSuelo() {
      ctx.strokeStyle = gris;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, suelo);
      ctx.lineTo(W, suelo);
      ctx.stroke();

      ctx.lineWidth = 1;

      for (let i = 0; i < W; i += 48) {
        const x = i - (frame * velocidad * 0.45) % 48;

        ctx.beginPath();
        ctx.moveTo(x, suelo + 13);
        ctx.lineTo(x + 18, suelo + 13);
        ctx.stroke();
      }
    }

    function dibujarNube(nube) {
      const x = nube.x;
      const y = nube.y;
      const s = nube.escala;

      ctx.strokeStyle = grisClaro;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(x, y, 10 * s, Math.PI, 0);
      ctx.arc(x + 16 * s, y - 8 * s, 13 * s, Math.PI, 0);
      ctx.arc(x + 35 * s, y, 10 * s, Math.PI, 0);
      ctx.lineTo(x + 45 * s, y + 7 * s);
      ctx.lineTo(x - 8 * s, y + 7 * s);
      ctx.closePath();
      ctx.stroke();
    }

    function actualizarNubes() {
      for (const nube of nubes) {
        nube.x -= velocidad * 0.18;

        if (nube.x < -80) {
          nube.x = W + Math.random() * 200;
          nube.y = 35 + Math.random() * 55;
          nube.escala = 0.7 + Math.random() * 0.5;
        }
      }
    }

    function dibujarZorro() {
      const x = zorro.x;
      const b = zorro.baseY;
      const paso = Math.floor(frame / 7) % 2;

      ctx.fillStyle = gris;

      if (zorro.agachado && !zorro.saltando) {
        // Cuerpo agachado
        rectRedondo(x + 8, b - 28, 50, 18, 8);
        ctx.fill();

        // Cabeza
        rectRedondo(x + 54, b - 32, 20, 18, 5);
        ctx.fill();

        // Hocico
        ctx.beginPath();
        ctx.moveTo(x + 72, b - 27);
        ctx.lineTo(x + 84, b - 23);
        ctx.lineTo(x + 72, b - 19);
        ctx.closePath();
        ctx.fill();

        // Oreja
        ctx.beginPath();
        ctx.moveTo(x + 58, b - 32);
        ctx.lineTo(x + 63, b - 43);
        ctx.lineTo(x + 68, b - 32);
        ctx.closePath();
        ctx.fill();

        // Cola
        ctx.beginPath();
        ctx.moveTo(x + 10, b - 24);
        ctx.lineTo(x - 25, b - 38);
        ctx.lineTo(x - 8, b - 15);
        ctx.closePath();
        ctx.fill();

        // Patas
        ctx.fillRect(x + 20, b - 9, 6, 9);
        ctx.fillRect(x + 45, b - 9, 6, 9);

        // Ojo
        ctx.fillStyle = fondo;
        ctx.fillRect(x + 67, b - 27, 3, 3);

      } else {
        // Cola
        ctx.beginPath();
        ctx.moveTo(x + 8, b - 30);
        ctx.lineTo(x - 28, b - 52);
        ctx.lineTo(x - 12, b - 22);
        ctx.closePath();
        ctx.fill();

        // Cuerpo
        rectRedondo(x + 8, b - 42, 52, 25, 10);
        ctx.fill();

        // Cabeza
        rectRedondo(x + 55, b - 50, 24, 23, 5);
        ctx.fill();

        // Hocico
        ctx.beginPath();
        ctx.moveTo(x + 77, b - 42);
        ctx.lineTo(x + 92, b - 36);
        ctx.lineTo(x + 77, b - 31);
        ctx.closePath();
        ctx.fill();

        // Orejas
        ctx.beginPath();
        ctx.moveTo(x + 58, b - 50);
        ctx.lineTo(x + 63, b - 64);
        ctx.lineTo(x + 69, b - 50);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x + 69, b - 49);
        ctx.lineTo(x + 74, b - 61);
        ctx.lineTo(x + 78, b - 48);
        ctx.closePath();
        ctx.fill();

        // Patas animadas
        ctx.fillRect(x + 18, b - 18, 5, paso ? 18 : 13);
        ctx.fillRect(x + 31, b - 18, 5, paso ? 13 : 18);
        ctx.fillRect(x + 47, b - 18, 5, paso ? 18 : 13);
        ctx.fillRect(x + 59, b - 18, 5, paso ? 13 : 18);

        // Ojo
        ctx.fillStyle = fondo;
        ctx.fillRect(x + 69, b - 42, 3, 3);
      }
    }

    function dibujarConejo() {
      const x = conejo.x;
      const b = conejo.baseY + Math.sin(frame * 0.12) * 3;

      ctx.fillStyle = gris;

      // Cuerpo
      rectRedondo(x, b - 24, 28, 17, 7);
      ctx.fill();

      // Cabeza
      rectRedondo(x + 22, b - 34, 18, 17, 5);
      ctx.fill();

      // Orejas
      ctx.fillRect(x + 26, b - 55, 4, 22);
      ctx.fillRect(x + 34, b - 52, 4, 19);

      // Patas
      ctx.fillRect(x + 7, b - 8, 8, 8);
      ctx.fillRect(x + 21, b - 8, 8, 8);

      // Cola
      ctx.beginPath();
      ctx.arc(x - 2, b - 18, 5, 0, Math.PI * 2);
      ctx.fill();

      // Ojo
      ctx.fillStyle = fondo;
      ctx.fillRect(x + 34, b - 28, 2, 2);
    }

    function crearObstaculo() {
      const r = Math.random();

      if (puntaje > 250 && r < 0.32) {
        const bajo = Math.random() < 0.65;

        obstaculos.push({
          tipo: "aguila",
          x: W + 20,
          y: bajo ? suelo - 63 : suelo - 105,
          w: 48,
          h: 24
        });
      } else if (r < 0.68) {
        obstaculos.push({
          tipo: "arbusto",
          x: W + 20,
          y: suelo - 28,
          w: 34,
          h: 28
        });
      } else {
        obstaculos.push({
          tipo: "tronco",
          x: W + 20,
          y: suelo - 20,
          w: 46,
          h: 20
        });
      }

      const reduccionSeparacion = Math.floor(puntaje / 1500);
      const separacionBase = Math.max(50, 85 - reduccionSeparacion);

      proximoObstaculo = frame + separacionBase + Math.floor(Math.random() * 65);
    }

    function dibujarArbusto(o) {
      ctx.fillStyle = gris;

      ctx.beginPath();
      ctx.arc(o.x + 8, o.y + 19, 9, 0, Math.PI * 2);
      ctx.arc(o.x + 18, o.y + 11, 13, 0, Math.PI * 2);
      ctx.arc(o.x + 30, o.y + 19, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillRect(o.x + 5, o.y + 18, 30, 10);
    }

    function dibujarTronco(o) {
      ctx.fillStyle = gris;

      rectRedondo(o.x, o.y, o.w, o.h, 8);
      ctx.fill();

      ctx.fillStyle = fondo;

      ctx.beginPath();
      ctx.arc(o.x + 9, o.y + 10, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = fondo;
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(o.x + 20, o.y + 7);
      ctx.lineTo(o.x + 36, o.y + 7);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(o.x + 22, o.y + 14);
      ctx.lineTo(o.x + 38, o.y + 14);
      ctx.stroke();
    }

    function dibujarAguila(o) {
      ctx.fillStyle = gris;

      const aleteo = Math.sin(frame * 0.25) * 7;

      // Ala izquierda
      ctx.beginPath();
      ctx.moveTo(o.x + 24, o.y + 12);
      ctx.lineTo(o.x + 2, o.y + aleteo);
      ctx.lineTo(o.x + 18, o.y + 16);
      ctx.closePath();
      ctx.fill();

      // Ala derecha
      ctx.beginPath();
      ctx.moveTo(o.x + 24, o.y + 12);
      ctx.lineTo(o.x + 48, o.y + aleteo);
      ctx.lineTo(o.x + 31, o.y + 16);
      ctx.closePath();
      ctx.fill();

      // Cuerpo
      rectRedondo(o.x + 17, o.y + 9, 18, 11, 5);
      ctx.fill();

      // Cabeza
      ctx.beginPath();
      ctx.arc(o.x + 38, o.y + 10, 6, 0, Math.PI * 2);
      ctx.fill();

      // Pico
      ctx.beginPath();
      ctx.moveTo(o.x + 44, o.y + 10);
      ctx.lineTo(o.x + 54, o.y + 13);
      ctx.lineTo(o.x + 44, o.y + 16);
      ctx.closePath();
      ctx.fill();

      // Ojo
      ctx.fillStyle = fondo;
      ctx.fillRect(o.x + 40, o.y + 8, 2, 2);
    }

    function dibujarObstaculos() {
      for (const o of obstaculos) {
        if (o.tipo === "arbusto") dibujarArbusto(o);
        if (o.tipo === "tronco") dibujarTronco(o);
        if (o.tipo === "aguila") dibujarAguila(o);
      }
    }

    function actualizarZorro() {
      zorro.baseY += zorro.velY;
      zorro.velY += gravedad;

      if (zorro.baseY >= suelo) {
        zorro.baseY = suelo;
        zorro.velY = 0;
        zorro.saltando = false;
      }
    }

    function actualizarObstaculos() {
      if (frame >= proximoObstaculo) {
        crearObstaculo();
      }

      for (const o of obstaculos) {
        o.x -= velocidad;
      }

      obstaculos = obstaculos.filter(o => o.x + o.w > -40);
    }

    function obtenerHitboxZorro() {
      if (zorro.agachado && !zorro.saltando) {
        return {
          x: zorro.x + 5,
          y: zorro.baseY - 33,
          w: 78,
          h: 30
        };
      }

      return {
        x: zorro.x - 2,
        y: zorro.baseY - 58,
        w: 88,
        h: 55
      };
    }

    function revisarChoque() {
      const z = obtenerHitboxZorro();

      for (const o of obstaculos) {
        const hit = {
          x: o.x + 3,
          y: o.y + 3,
          w: o.w - 6,
          h: o.h - 5
        };

        const choque =
          z.x < hit.x + hit.w &&
          z.x + z.w > hit.x &&
          z.y < hit.y + hit.h &&
          z.y + z.h > hit.y;

        if (choque) {
          juegoTerminado = true;
        }
      }
    }

    function dibujarUI() {
      ctx.fillStyle = gris;
      ctx.font = "18px Arial";

      ctx.fillText(
        "Puntaje: " + Math.floor(puntaje).toLocaleString("es-PE") + " / " + metaPuntaje.toLocaleString("es-PE"),
        20,
        30
      );

      ctx.font = "14px Arial";
      ctx.fillText("Objetivo: llega a 99 000 puntos", 20, 52);
      ctx.fillText("Velocidad: " + velocidad.toFixed(1), 20, 72);

      const progreso = Math.min(puntaje / metaPuntaje, 1);

      ctx.strokeStyle = gris;
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 85, 220, 10);

      ctx.fillStyle = gris;
      ctx.fillRect(20, 85, 220 * progreso, 10);
    }

    function dibujarGameOver() {
      ctx.fillStyle = "rgba(247, 247, 247, 0.92)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = gris;
      ctx.font = "44px Arial";
      ctx.fillText("Juego terminado", 285, 125);

      ctx.font = "22px Arial";
      ctx.fillText("Presiona Espacio para reiniciar", 292, 170);
      ctx.fillText("Puntaje: " + Math.floor(puntaje).toLocaleString("es-PE"), 370, 210);
    }

    function dibujarVictoria() {
      ctx.fillStyle = "rgba(247, 247, 247, 0.92)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = gris;
      ctx.font = "44px Arial";
      ctx.fillText("¡Ganaste!", 350, 120);

      ctx.font = "22px Arial";
      ctx.fillText("Llegaste a 99 000 puntos", 310, 165);
      ctx.fillText("Presiona Espacio para jugar otra vez", 270, 205);
    }

    function actualizarJuego() {
      if (!juegoTerminado && !ganaste) {
        frame++;
        puntaje++;

        // Estilo Dinosaurio de Google:
        // cada 100 puntos sube la velocidad.
        const nivelVelocidad = Math.floor(puntaje / 100);
        velocidad = 6 + nivelVelocidad * 0.025;

        actualizarNubes();
        actualizarZorro();
        actualizarObstaculos();
        revisarChoque();

        if (puntaje >= metaPuntaje) {
          ganaste = true;
        }
      }
    }

    function dibujarJuego() {
      ctx.clearRect(0, 0, W, H);

      for (const nube of nubes) {
        dibujarNube(nube);
      }

      dibujarSuelo();
      dibujarConejo();
      dibujarObstaculos();
      dibujarZorro();
      dibujarUI();

      if (juegoTerminado) {
        dibujarGameOver();
      }

      if (ganaste) {
        dibujarVictoria();
      }
    }

    function loop() {
      actualizarJuego();
      dibujarJuego();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", function(e) {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") {
        e.preventDefault();
      }

      if ((e.code === "Space" || e.code === "ArrowUp") && (juegoTerminado || ganaste)) {
        reiniciar();
        return;
      }

      if (
        (e.code === "Space" || e.code === "ArrowUp") &&
        !zorro.saltando &&
        !zorro.agachado &&
        !juegoTerminado &&
        !ganaste
      ) {
        zorro.velY = -13;
        zorro.saltando = true;
      }

      if (
        (e.code === "ArrowDown" || e.key.toLowerCase() === "s") &&
        !zorro.saltando &&
        !juegoTerminado &&
        !ganaste
      ) {
        zorro.agachado = true;
      }
    });

    window.addEventListener("keyup", function(e) {
      if (e.code === "ArrowDown" || e.key.toLowerCase() === "s") {
        zorro.agachado = false;
      }
    });

    reiniciar();
    loop();
  </script>
</body>
</html>
